<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Analisis Energi</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container{
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            color: #333;
        }

        input, select{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button{
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #0056b3;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td{
            border: 1px solid #ccc;
        }

        th{
            background: #007bff;
            color: white;
        }

        th, td{
            padding: 10px;
            text-align: center;
        }

        .hasil{
            margin-top: 20px;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>Sistem Analisis Energi Listrik</h1>

    <input type="text" id="nama" placeholder="Nama Perangkat">

    <input type="number" id="daya" placeholder="Daya (Watt)">

    <input type="number" id="jam" placeholder="Jam Pemakaian per Hari">

    <select id="jenis">
        <option value="statis">Perangkat Statis</option>
        <option value="intermiten">Perangkat Intermiten</option>
    </select>

    <button onclick="tambahPerangkat()">
        Tambah Perangkat
    </button>

    <table id="tabel">
        <thead>
            <tr>
                <th>Nama</th>
                <th>Daya</th>
                <th>Jam/Hari</th>
                <th>Jenis</th>
                <th>kWh/Bulan</th>
                <th>Biaya/Bulan</th>
            </tr>
        </thead>

        <tbody>

        </tbody>
    </table>

    <div class="hasil">
        <h3 id="totalKwh">
            Total Konsumsi: 0 kWh/bulan
        </h3>

        <h3 id="totalBiaya">
            Total Tagihan: Rp 0
        </h3>

        <h3 id="palingBoros">
            Perangkat Paling Boros: -
        </h3>
    </div>

</div>

<script>

    const tarif = 1444.70;

    let perangkatList = [];

    function tambahPerangkat(){

        let nama = document.getElementById("nama").value;
        let daya = parseFloat(document.getElementById("daya").value);
        let jam = parseFloat(document.getElementById("jam").value);
        let jenis = document.getElementById("jenis").value;

        if(!nama || isNaN(daya) || isNaN(jam)){
            alert("Isi semua data!");
            return;
        }

        let kwhHarian;

        if(jenis === "statis"){
            kwhHarian = (daya * jam) / 1000;
        } else {
            kwhHarian = (daya * jam * 0.95) / 1000;
        }

        let kwhBulanan = kwhHarian * 30;
        let biayaBulanan = kwhBulanan * tarif;

        let perangkat = {
            nama,
            daya,
            jam,
            jenis,
            kwhBulanan,
            biayaBulanan
        };

        perangkatList.push(perangkat);

        tampilkanData();

        document.getElementById("nama").value = "";
        document.getElementById("daya").value = "";
        document.getElementById("jam").value = "";
    }

    function tampilkanData(){

        let tbody = document.querySelector("#tabel tbody");

        tbody.innerHTML = "";

        let totalKwh = 0;
        let totalBiaya = 0;

        let palingBoros = null;

        perangkatList.forEach((p)=>{

            totalKwh += p.kwhBulanan;
            totalBiaya += p.biayaBulanan;

            if(
                palingBoros === null ||
                p.biayaBulanan > palingBoros.biayaBulanan
            ){
                palingBoros = p;
            }

            tbody.innerHTML += `
                <tr>
                    <td>${p.nama}</td>
                    <td>${p.daya} W</td>
                    <td>${p.jam} Jam</td>
                    <td>${p.jenis}</td>
                    <td>${p.kwhBulanan.toFixed(2)}</td>
                    <td>Rp ${p.biayaBulanan.toLocaleString()}</td>
                </tr>
            `;
        });

        document.getElementById("totalKwh").innerHTML =
            `Total Konsumsi: ${totalKwh.toFixed(2)} kWh/bulan`;

        document.getElementById("totalBiaya").innerHTML =
            `Total Tagihan: Rp ${totalBiaya.toLocaleString()}`;

        document.getElementById("palingBoros").innerHTML =
            palingBoros
            ? `Perangkat Paling Boros: ${palingBoros.nama}`
            : "Perangkat Paling Boros: -";
    }

</script>

</body>
</html>
